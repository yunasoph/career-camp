name: careercampus

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-careercampus}
      POSTGRES_USER: ${DB_USER:-careercampus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careercampus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-careercampus} -d ${DB_NAME:-careercampus}"]
      interval: 5s
      timeout: 5s
      retries: 12

  php:
    build: ./backend
    command: php-fpm
    working_dir: /app
    env_file: .env
    environment:
      DB_HOST: db
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./backend:/app
      # Dev opcache tuning (revalidate_freq 60): on the Windows/WSL2 9P
      # bind mount, the stock 2s revalidation stat'ed every source file and
      # made API requests spike to ~2s. 'zz-' sorts after the stock conf.d
      # files so these values win.
      - ./backend/php-opcache-dev.ini:/usr/local/etc/php/conf.d/zz-opcache-dev.ini:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - web

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - webnode_modules:/app/node_modules

volumes:
  pgdata:
  webnode_modules:
