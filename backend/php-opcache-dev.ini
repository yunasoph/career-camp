; Dev-only opcache tuning for the Windows/WSL2 dev box (mounted read-only
; into the php container by docker-compose.yml, after the stock conf.d
; files so it wins).
;
; Why: the app source is served through a 9P bind mount (./backend:/app),
; and every ~2 seconds the stock opcache revalidated its cache by stat'ing
; every file — each stat crossing the slow Windows→WSL2 boundary — so API
; requests alternated between ~0.6s and ~2s. Raising revalidate_freq to 60
; makes those revalidation spikes rare; the steady cost is then just the
; per-request autoloader stat'ing, which `composer dump-autoload -o`
; (optimized classmap, see docker-compose README note in DECISIONS.md)
; removes for known classes.
;
; Trade-off: after editing PHP source the change takes up to 60s to apply,
; or apply it immediately with `docker compose restart php`.
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=60
